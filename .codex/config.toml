profile = "bashly"

[profiles.bashly]
model = "gpt-5.4-mini"
model_reasoning_effort = "medium"
approval_policy = "never"
sandbox_mode = "workspace-write"
web_search = "disabled"
model_reasoning_summary = "auto"

[features]
shell_tool = true
shell_snapshot = false
hooks = false
codex_hooks = false

[history]
persistence = "none"
max_bytes = 10485760

[shell_environment_policy]
inherit = "core"
include_only = [
  "HOME",
  "PATH",
  "SHELL",
  "TERM",
  "USER",
  "LOGNAME",
  "PWD",
  "LANG",
  "LC_.*",

  "XDG_CONFIG_HOME",
  "XDG_DATA_HOME",
  "XDG_STATE_HOME",
  "XDG_CACHE_HOME",

  "CODEX_HOME",
  "CODEX_STATE",
  "CODEX_CACHE",
  "CODEX_SQLITE_HOME",

  "BASHLY_.*",
]
exclude = [".*TOKEN.*", ".*SECRET.*", ".*KEY.*", ".*PASSWORD.*"]
experimental_use_profile = false
ignore_default_excludes = false
