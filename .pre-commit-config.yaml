minimum_pre_commit_version: "3.0.0"

repos:
  - repo: local
    hooks:
      - id: bashly-shell-validation
        name: agent surface drift check
        entry: go run github.com/fatb4f/agent-sdk/cmd/agentctl@latest check-generated --project-root .
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^(agent\.cue|meta/agent/.*|src/.*|bashly(?:-settings)?\.yml|settings\.yml)$
