minimum_pre_commit_version: "3.0.0"

repos:
  - repo: local
    hooks:
      - id: bashly-pre-commit-ci
        name: agentctl generate
        entry: go run github.com/fatb4f/agent-sdk/cmd/agentctl generate --project-root .
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^(agent\.cue|meta/agent/.*|agent-sdk/.*\.(cue|go|tmpl)|go\.work)$
