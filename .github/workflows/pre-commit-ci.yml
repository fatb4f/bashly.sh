name: pre-commit-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run Go tests
        run: go test ./...

      - name: Check agent schema
        run: go run github.com/fatb4f/agent-sdk/cmd/agentctl vet --project-root .

      - name: Check agent generated surfaces
        run: go run github.com/fatb4f/agent-sdk/cmd/agentctl check-generated --project-root .

      - name: Run agentctl doctor
        run: go run github.com/fatb4f/agent-sdk/cmd/agentctl doctor --project-root .
