name: session
help: Session lock, unlock, and OSD manager
version: 1.0.0

environment_variables:
  - name: XDG_SESSION_ID
    help: Current logind session id.
  - name: XDG_CONFIG_HOME
    help: Configuration root used to locate hyprlock config.

commands:
  - name: lock
    help: Request session lock through logind
    filename: commands/lock.sh
    flags:
      - long: --request
        help: Explicitly request logind lock. This is the default behavior.
      - long: --run-locker
        help: Compatibility alias for `session locker`.
    examples:
      - session lock
      - session lock --request
      - session lock --run-locker

  - name: locker
    help: Run the concrete screen locker
    filename: commands/locker.sh
    examples:
      - session locker

  - name: unlock
    help: Unlock the current session and clean up lock-side timers
    filename: commands/unlock.sh
    examples:
      - session unlock

  - name: osd
    help: Apply an on-screen display update
    filename: commands/osd.sh
    args:
      - name: action
        help: OSD action to execute
        required: true
    examples:
      - session osd volume-up
      - session osd volume-down
      - session osd volume-toggle
      - session osd brightness-up
      - session osd brightness-down
