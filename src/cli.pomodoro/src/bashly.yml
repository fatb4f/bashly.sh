name: pomodoroctl
help: Small systemd-user backed Pomodoro status reader
version: 0.1.0

commands:
- name: status
  help: Print Pomodoro state plus related systemd units/timers
  default: force

environment_variables:
- name: POMODOROCTL_NO_SYSTEMD
  help: If set to 1, do not query systemd units or timers
  default: "0"
