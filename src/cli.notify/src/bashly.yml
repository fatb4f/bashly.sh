name: cli.notify
help: Bashly-authored dispatcher for Hyprland backlight and sound notifications
version: 0.1.0

commands:
  - name: backlight
    help: Backlight notification namespace
    commands:
      - name: up
        help: Report the current backlight percent to Lucent
        filename: backlight_up_command.sh
        examples:
          - cli.notify backlight up

      - name: down
        help: Report the current backlight percent to Lucent
        filename: backlight_down_command.sh
        examples:
          - cli.notify backlight down

  - name: sound
    help: Sound notification namespace
    commands:
      - name: up
        help: Report the current sound percent to Lucent
        filename: sound_up_command.sh
        examples:
          - cli.notify sound up

      - name: down
        help: Report the current sound percent to Lucent
        filename: sound_down_command.sh
        examples:
          - cli.notify sound down
